<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcador · Diorama GBA</title>
<style>
  body { margin: 0; font: 16px/1.45 system-ui, sans-serif; background: #fff; color: #111; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px; }
  #marker { width: 10cm; height: 10cm; }
  #marker svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
  .note { max-width: 32em; text-align: center; color: #444; }
  .arrow { font-size: 14px; color: #444; }
  @media print { .note, .screen-only { display: none; } body { padding: 0; } }
</style>
</head>
<body>
<p class="note">Imprime esta página em A4 com a escala a 100% (sem "ajustar à página"). O quadrado preto deve medir 10 cm de lado. Também podes mostrar este ecrã noutro telemóvel ou tablet e acertar o tamanho no menu ☰ da app.</p>
<div class="arrow">▲ fundo do jogo</div>
<div id="marker"></div>
<div class="arrow">▼ olha a partir deste lado</div>
<p class="note screen-only">Marcador ARUCO_MIP_36h12, número 0.</p>
<script src="vendor/aruco/cv.js"></script>
<script src="vendor/aruco/aruco.js"></script>
<script>
  // The SVG has a 1-cell white margin around the black square; size it so the black square is exactly 10 cm.
  var svg = new AR.Dictionary('ARUCO_MIP_36h12').generateSVG(0);
  var cells = Number(/viewBox="0 0 (\d+)/.exec(svg)[1]);
  var box = document.getElementById('marker');
  box.innerHTML = svg;
  box.style.width = box.style.height = (10 * cells / (cells - 2)) + 'cm';
</script>
</body>
</html>
